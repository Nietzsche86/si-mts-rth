name: Build Android APK & Flutter Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze, Test & Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift Code Generation)
        run: dart run build_runner build

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
