name: app
description: "Aplikasi Manajemen Data & Rekap Nilai MTs Roudhotut Thowalib (Offline-First)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Database Offline & Enkripsi SQLCipher
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.5.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Penyimpanan Kunci Aman (Android Keystore)
  flutter_secure_storage: ^9.2.2
  
  # Jaringan & HTTP Sync
  dio: ^5.4.3
  
  # Keamanan Layar Sensitif (FLAG_SECURE)
  flutter_windowmanager: ^0.2.0
  
  # Utilitas
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
